name: Development checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.5'
      # Offline suites: Modal, the Meta API and curl are all faked, so nothing here is paid or networked.
      - run: python -I -m unittest discover -s tests/submission -v
      - run: python -I -m unittest discover -s tests/deploy -v
      - run: python -I -m unittest discover -s cli/muse -p 'test_*.py' -v
      - run: python -I -m unittest discover -s cli/semantic-scholar -p 'test_*.py' -v
      - run: python -m venv data/python/.venv
      - run: data/python/.venv/bin/python -m pip install -r python/requirements.txt
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
